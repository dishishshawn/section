# Alembic configuration for Section.
#
# Run from the backend/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "short description"
#   alembic downgrade -1
#
# The sqlalchemy.url below is a fallback used only when DATABASE_URL is unset.
# env.py overrides it with os.environ["DATABASE_URL"] at runtime, so Alembic
# targets the same database as the running app.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///../section_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
